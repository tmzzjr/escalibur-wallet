# Gera EscaliburWallet.xcodeproj:  xcodegen generate
name: EscaliburWallet
options:
  bundleIdPrefix: app.escalibur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
packages:
  EscaliburKit:
    path: Kit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Traducao: o compilador lista os textos de Text, String(localized:) e kitText, e o
    # catalogo (Localizable.xcstrings) guarda cada um em todos os idiomas.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  EscaliburWallet:
    type: application
    platform: iOS
    sources:
      - path: App/EscaliburWallet
        excludes:
          - "Resources/Info.plist"
          - "Resources/EscaliburWallet.entitlements"
      - path: App/Shared
      - path: App/EscaliburWidgets/PriceWidgetViews.swift
    dependencies:
      - target: EscaliburWidgets
      - package: EscaliburKit
        product: EscaliburCore
      - package: EscaliburKit
        product: EscaliburChains
      - package: EscaliburKit
        product: EscaliburKeys
      - package: EscaliburKit
        product: EscaliburNetwork
      - package: EscaliburKit
        product: EscaliburEngines
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.escalibur.wallet
        PRODUCT_NAME: EscaliburWallet
        DEVELOPMENT_TEAM: 2UNWMDD93S
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/EscaliburWallet/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/EscaliburWallet/Resources/EscaliburWallet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
  # Os widgets do preco recente (tela bloqueada e de inicio). So leem o arquivo que o app
  # grava na pasta do App Group: sem o Kit, sem rede, sem chaveiro.
  EscaliburWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/EscaliburWidgets
        excludes:
          - "Info.plist"
          - "EscaliburWidgets.entitlements"
      - path: App/Shared
      # As traducoes do widget sao as do app (um catalogo so).
      - path: App/EscaliburWallet/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.escalibur.wallet.widgets
        PRODUCT_NAME: EscaliburWidgets
        DEVELOPMENT_TEAM: 2UNWMDD93S
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/EscaliburWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/EscaliburWidgets/EscaliburWidgets.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
  EscaliburWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/EscaliburWalletTests
        excludes:
          - "Fixtures/**"
    dependencies:
      - target: EscaliburWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.escalibur.wallet.tests
        DEVELOPMENT_TEAM: 2UNWMDD93S
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
  EscaliburWalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/EscaliburWalletUITests
    dependencies:
      - target: EscaliburWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.escalibur.wallet.uitests
        DEVELOPMENT_TEAM: 2UNWMDD93S
        TEST_TARGET_NAME: EscaliburWallet
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  EscaliburWallet:
    build:
      targets:
        EscaliburWallet: all
    test:
      # Os testes leem os textos em portugues e os valores no formato do Brasil, em
      # qualquer simulador.
      language: pt-BR
      region: BR
      targets:
        - EscaliburWalletTests
        - EscaliburWalletUITests
