# Gera EscaliburWallet.xcodeproj:  xcodegen generate
name: EscaliburWallet
options:
  bundleIdPrefix: com.thomazjr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
packages:
  EscaliburKit:
    path: Kit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  EscaliburWallet:
    type: application
    platform: iOS
    sources:
      - path: App/EscaliburWallet
        excludes:
          - "Resources/Info.plist"
          - "Resources/EscaliburWallet.entitlements"
    dependencies:
      - package: EscaliburKit
        product: EscaliburCore
      - package: EscaliburKit
        product: EscaliburChains
      - package: EscaliburKit
        product: EscaliburKeys
      - package: EscaliburKit
        product: EscaliburNetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomazjr.escalibur.wallet
        PRODUCT_NAME: EscaliburWallet
        DEVELOPMENT_TEAM: 2UNWMDD93S
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/EscaliburWallet/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/EscaliburWallet/Resources/EscaliburWallet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
  EscaliburWalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/EscaliburWalletUITests
    dependencies:
      - target: EscaliburWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomazjr.escalibur.wallet.uitests
        DEVELOPMENT_TEAM: 2UNWMDD93S
        TEST_TARGET_NAME: EscaliburWallet
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  EscaliburWallet:
    build:
      targets:
        EscaliburWallet: all
    test:
      targets:
        - EscaliburWalletUITests
