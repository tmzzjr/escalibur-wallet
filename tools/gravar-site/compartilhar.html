<!doctype html>
<!-- A imagem de compartilhamento do site (site/compartilhar.jpg, 1200x630). Para gerar de
     novo: gere o site, sirva build/ com o site em /escalibur-wallet/, abra esta pagina no
     Chrome em 1200x630, capture e converta para JPEG. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/escalibur-wallet/estilo.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0B0B0C}
.og{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:640px 1fr;align-items:center;padding:0 0 0 88px;box-sizing:border-box}
.og img.icone{width:88px;height:88px;border-radius:20px;margin-bottom:28px}
.og h1{font-size:76px;line-height:1.0;letter-spacing:-0.045em;color:#F5F5F6;margin:0}
.og p{font-size:27px;line-height:1.35;color:#A8A8AE;margin:22px 0 0;letter-spacing:-0.02em;max-width:500px}
.og .nome{font-size:24px;font-weight:600;color:#A8A8AE;margin:0 0 14px;letter-spacing:-0.02em}
.og .fones{position:relative;height:630px}
.og .aparelho{position:absolute;--w:300px}
.og .a1{left:40px;top:70px;z-index:2}
.og .a2{left:250px;top:150px;--w:270px;z-index:1}
.og .a2 .tela{filter:brightness(.8)}
</style></head>
<body>
<div class="og">
<div>
<img class="icone" src="/escalibur-wallet/icone-256.png" alt="">
<p class="nome">Escalibur Wallet</p>
<h1>Suas chaves.<br>Só no seu iPhone.</h1>
<p>Carteira cripto sem custódia, com cada transação conferida antes de assinar.</p>
</div>
<div class="fones">
<div class="aparelho a2"><div class="tela"><img src="/escalibur-wallet/midia/receber.webp" alt=""></div></div>
<div class="aparelho a1"><div class="tela"><img src="/escalibur-wallet/midia/carteira.webp" alt=""></div></div>
</div>
</div>
</body></html>
