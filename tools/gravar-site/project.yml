# As telas do site, gravadas no simulador: tools/gravar-site/gravar.sh.
#
# Um projeto a parte, fora do app: o alvo de UI test dirige a Escalibur Wallet ja
# instalada (build Debug, modo demo) pelo bundle id, e o Palco e so o app vazio que todo
# alvo de UI test exige. Nada daqui entra no app nem no build de distribuicao.
name: GravarSite
options:
  bundleIdPrefix: app.escalibur.gravarsite
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Palco:
    type: application
    platform: iOS
    sources: [Palco]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.escalibur.gravarsite.palco
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  Cenas:
    type: bundle.ui-testing
    platform: iOS
    sources: [Cenas]
    dependencies:
      - target: Palco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.escalibur.gravarsite.cenas
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Palco
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  Cenas:
    build:
      targets:
        Palco: all
        Cenas: [test]
    test:
      targets:
        - Cenas
