# As paginas publicas que a App Store pede (suporte e politica de privacidade), no
# GitHub Pages: tmzzjr.github.io/escalibur-wallet. Saem dos mesmos textos que o app
# mostra, pelo tools/gerar-site.py, a cada mudanca deles na main.
name: site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - App/EscaliburWallet/Resources/Legal/**
      - tools/gerar-site.py
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      # Acoes fixadas por commit, nunca por tag movel.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Gerar as paginas
        run: python3 tools/gerar-site.py "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - id: publicacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
